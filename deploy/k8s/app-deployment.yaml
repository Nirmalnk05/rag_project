apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-app
  labels: { app: rag-app }
spec:
  replicas: 3
  selector:
    matchLabels: { app: rag-app }
  template:
    metadata:
      labels: { app: rag-app }
      annotations:
        # The counters live in each replica's memory, so every pod has to be
        # scraped separately and the queries aggregate with sum() -- see
        # deploy/monitoring/grafana/dashboards/rag-overview.json.
        #
        # These annotations are read by a plain Prometheus using
        # kubernetes_sd_config with the usual annotation relabeling. The
        # prometheus-operator ignores them: there, create a ServiceMonitor for
        # the rag-app Service instead. Either way the scraper's namespace needs
        # `kubectl label namespace <ns> rag-monitoring=true`, or default-deny
        # drops the scrape (deploy/k8s/networkpolicy.yaml).
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: rag-app
          image: your-registry/rag-app:latest   # build+push your image
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: rag-config }
            - secretRef: { name: rag-secrets }
          # The Retriever is built in the FastAPI lifespan hook, so uvicorn
          # accepts NO connections until chunks.json is loaded and the BM25
          # index is built — measured at ~90s for 100k chunks. Liveness alone
          # (initialDelay 10 + 3x15s) kills the container at ~55s: crash loop.
          # startupProbe suspends liveness AND readiness until it succeeds.
          startupProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
            failureThreshold: 30     # 300s budget; raise with corpus size
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /ready, port: 8000 }
            periodSeconds: 10
            failureThreshold: 3
          # Measured at 100k chunks: ~1.8Gi retrieval state (chunk store +
          # BM25) plus ~1.1Gi reranker, ~130Mi embedder and the torch runtime —
          # roughly 3.5-4Gi, i.e. at this limit. Re-measure before raising the
          # corpus, and do not autoscale on CPU (see aws.md 7.2: the embed and
          # rerank locks make a saturated pod look CPU-idle).
          resources:
            requests: { cpu: "1", memory: "2Gi" }
            limits: { cpu: "2", memory: "4Gi" }
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        # chunks.json / caches. Use a ReadWriteMany PVC (or an initContainer that
        # syncs the ingested artifacts) so every replica reads the same index.
        - name: data
          persistentVolumeClaim: { claimName: rag-data }
