services:
  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334

  app:
    build: .
    container_name: rag-app
    ports:
      - "8000:8000"
    environment:
      - QDRANT_HOST=qdrant
    env_file:
      - .env
    depends_on:
      - qdrant
    volumes:
      - ./data:/app/data

  # Optional local LLM. Enable with:  docker compose --profile local-llm up -d
  # Then set LLM_PROVIDER=ollama and OLLAMA_BASE_URL=http://ollama:11434 in .env.
  ollama:
    image: ollama/ollama:latest
    container_name: rag-ollama
    profiles: ["local-llm"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

volumes:
  qdrant_data:
  ollama_models:
