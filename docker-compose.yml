services:
  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334

  app:
    build: .
    container_name: rag-app
    ports:
      - "8000:8000"
    environment:
      - QDRANT_HOST=qdrant
    env_file:
      - .env
    depends_on:
      - qdrant
    volumes:
      - ./data:/app/data

volumes:
  qdrant_data:
